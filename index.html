<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鏡界之外｜互動體驗</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap');
:root{--orange:#ef7200;--ink:#141414;--cream:#f7f3ef}*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:var(--ink);font-family:'Noto Serif TC',serif}.app{width:min(100%,520px);min-height:100svh;margin:auto;background:#fff;overflow:hidden}.screen{display:none;min-height:100svh;padding:22px;position:relative}.screen.active{display:flex;flex-direction:column}.orange{background:url('assets/orange-bg.png') center/cover;color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.host{width:46px;height:46px;object-fit:contain}.event-logo{display:block;width:220px;max-width:77%;height:auto;object-fit:contain}.label,.counter{font:11px 'Playfair Display';letter-spacing:2px}.rule{height:1px;background:currentColor;opacity:.8;margin:15px 0}.hero{width:110%;max-width:none;margin:25px -5% 6px}.home h1{font-size:29px;line-height:1.45;margin:4px 0 8px}.home p{font-size:15px;line-height:1.9;margin:0}.btn{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:15px;font:16px 'Noto Serif TC';letter-spacing:1px;margin-top:18px;cursor:pointer}.btn:hover{background:var(--orange);border-color:var(--orange)}.orange .btn{background:#fff;color:var(--ink);border-color:#fff}.progress{display:flex;gap:5px;margin:14px 0 24px}.progress i{height:4px;flex:1;background:#ddd}.progress i.on{background:var(--orange)}.orange .progress i{background:#ffc98a}.orange .progress i.on{background:#fff}.stage{font:11px 'Playfair Display';letter-spacing:2.2px;color:var(--orange)}.orange .stage{color:#fff}.game h2{font-size:28px;line-height:1.43;margin:9px 0}.desc{font-size:14px;line-height:1.85;color:#625a52;margin:0}.orange .desc{color:#fff}.task{margin-top:auto;padding-top:20px}.choice{display:flex;gap:11px;width:100%;padding:14px;margin:8px 0;background:#fff;border:1px solid #aaa;text-align:left;font:16px 'Noto Serif TC';cursor:pointer;color:var(--ink)}.choice b{font:12px 'Playfair Display';color:var(--orange)}.orange .choice{border-color:#fff}.petals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:28px 0 4px}.petal{aspect-ratio:1;border:1px solid #aaa;background:#fff;font-size:25px;cursor:pointer}.petal.active{background:var(--orange);border-color:var(--orange);transform:translateY(-4px);font-size:0}.petal.active:before{content:'✿';color:#fff;font-size:27px}.roller{display:flex;align-items:center;justify-content:center;gap:26px;margin:28px 0}.roller button{width:56px;height:56px;border:1px solid #aaa;background:#fff;font-size:28px}.num{min-width:88px;text-align:center;font:78px/.8 'Playfair Display'}.paw-note{text-align:center;font-size:14px;margin:8px 0 14px}.paws{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.paw{border:1px solid #aaa;background:#fff;padding:14px 7px;color:#777;font:28px serif;cursor:pointer}.paw.active{background:var(--ink);color:#fff;border-color:var(--ink)}.orange .paw{border-color:#fff}.feedback{min-height:28px;margin-top:13px;text-align:center;font-size:13px;line-height:1.7}.feedback.bad{color:#b23411}.orange .feedback.bad{color:#fff}.feedback.good{color:#237541}.orange .feedback.good{color:#fff}.range{width:100%;accent-color:var(--orange);margin:26px 0 5px}.range-labels{display:flex;justify-content:space-between;font-size:13px}.result{background:#fff;text-align:center;overflow:hidden}.result:before{content:'';position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,#222 0 18%,#555 19% 20%,#ddd 21% 32%,transparent 33%);right:-148px;top:190px;opacity:.14}.result>*{position:relative}.result .event-logo{margin:12px auto 8px}.result-card{margin:14px 0 18px;padding:22px 20px 18px;border:1px solid var(--ink);text-align:left;position:relative;background:linear-gradient(125deg,#fff 0 66%,var(--cream) 66%)}.result-card:after{content:'';height:5px;width:54%;background:var(--orange);position:absolute;right:0;top:0}.kicker{margin:0;font:11px 'Playfair Display';letter-spacing:2.5px;color:var(--orange)}.result h2{font-size:35px;line-height:1.25;margin:9px 0 4px}.en{margin:0 0 15px;font:13px 'Playfair Display';letter-spacing:3.3px}.result-copy{font-size:15px;line-height:1.9;margin:0}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.badges span{padding:5px 7px;border:1px solid #aaa;background:#fff;font-size:11px}.footer{font:10px 'Playfair Display';letter-spacing:1.8px;color:#666;margin:0}.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.share button{padding:14px;border:1px solid var(--ink);background:#fff;font:14px 'Noto Serif TC'}.share button:last-child{background:var(--ink);color:#fff}.fade{animation:fade .3s ease}@keyframes fade{50%{opacity:.2;transform:scale(.99)}}
</style></head><body><main class="app">
<section id="home" class="screen home active"><div class="top"><img class="host" src="assets/host-logo.png"><span class="label">INTERACTIVE EXHIBITION</span></div><div class="rule"></div><img class="event-logo" src="assets/event-logo.png"><img class="hero" src="assets/main-visual.png"><h1>從一個視線開始，<br>走進鏡界之外。</h1><p>完成 6 個觀察任務，找出展場裡的花、太陽與動物，最後解鎖你的觀看人格。</p><button class="btn" onclick="start()">進入鏡界　ENTER</button></section>
<section id="game" class="screen game"><div class="top"><img class="host" src="assets/host-logo.png"><span id="counter" class="counter"></span></div><div class="rule"></div><div id="progress" class="progress"></div><div id="stage" class="stage"></div><h2 id="question"></h2><p id="desc" class="desc"></p><div id="task" class="task"></div></section>
<section id="result" class="screen result"><div class="top"><img class="host" src="assets/host-logo.png"><span class="counter">YOUR VIEW</span></div><div class="rule"></div><img class="event-logo" src="assets/event-logo.png"><div class="result-card"><p class="kicker">鏡界之外，你是</p><h2 id="resultTitle"></h2><p id="resultEn" class="en"></p><p id="resultCopy" class="result-copy"></p><div class="badges"><span>3 朵花</span><span>9 顆太陽</span><span>9 種動物</span></div></div><p class="footer">BEYOND THE FRAME · FCU EMBA PAA</p><div class="share"><button onclick="saveCard()">儲存結果卡</button><button onclick="shareCard()">分享我的結果</button></div><img class="host" src="assets/host-logo.png"></section>
</main><canvas id="canvas" width="1080" height="1350" hidden></canvas><script>
const screens={home:document.getElementById('home'),game:document.getElementById('game'),result:document.getElementById('result')};
const Q=[
 {stage:'01 / FLOWER',title:'花的低語',desc:'展場中有幾件作品以花卉為主角？',kind:'flower',answer:3,hint:'再走近一點，還有花正在畫面裡盛開。'},
 {stage:'02 / SUN',title:'追光搜查隊',desc:'包含日出與夕陽，展場裡一共藏了幾顆太陽？',kind:'sun',answer:9,hint:'再抬頭看看，有些光藏在遠方。'},
 {stage:'03 / ANIMAL',title:'動物觀察站',desc:'展場中有幾種不同的動物？牠們散落在 14 張作品中，同一種類只算一次。',kind:'animal',answer:9,hint:'別急，還有幾位非人類主角躲在展場裡。'},
 {stage:'04 / FIRST GLANCE',title:'先抓住你視線的是什麼？',desc:'沒有對錯，選擇你剛剛在展場最容易停下來看的畫面。',kind:'choice',choices:[['畫面裡的光線','light'],['人物或情緒','emotion'],['被略過的小細節','detail'],['空間與留白','space']]},
 {stage:'05 / FEEL',title:'把感受調到此刻的位置',desc:'沒有對錯，只是你與畫面之間的距離。',kind:'feel'},
 {stage:'06 / TAKE AWAY',title:'離開鏡界前，你想帶走什麼？',desc:'這個選擇會形成你的觀看人格。',kind:'choice',choices:[['一束改變畫面的光','light'],['一個未說完的表情','emotion'],['一處耐人尋味的細節','detail'],['一段框外的想像','space']]}
];
const R={light:['逐光的人','LIGHT CHASER','你總是先看見光落下的位置。對你來說，光不只是照亮畫面，而是在替一段故事指路。'],emotion:['畫外的聆聽者','STORY LISTENER','你會停在表情、距離與關係之間。你看見的不只是一張照片，而是畫面外仍在延續的故事。'],detail:['細節採集者','DETAIL KEEPER','別人匆匆略過的紋理、線條與微小瞬間，總會被你收進眼裡。你的觀看，很安靜卻很深。'],space:['越框旅人','BEYOND THE FRAME','你會被門、倒影、留白與遠方吸引。你知道影像的邊界，從來不是故事的終點。']};
let n=0,score={light:0,emotion:0,detail:0,space:0},selected=0,currentResult;
function start(){screens.home.classList.remove('active');screens.game.classList.add('active');draw()}
function draw(){let a=Q[n],g=screens.game;g.classList.toggle('orange',n%2===1);document.getElementById('counter').textContent=String(n+1).padStart(2,'0')+' / 06';document.getElementById('stage').textContent=a.stage;document.getElementById('question').textContent=a.title;document.getElementById('desc').textContent=a.desc;document.getElementById('progress').innerHTML=Q.map((_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('');selected=0;document.getElementById('task').innerHTML=task(a)}
function feedback(){return '<div id="feedback" class="feedback"></div>'}
function task(a){if(a.kind==='flower')return '<div class="petals">'+[1,2,3,4,5].map(i=>'<button class="petal" data-n="'+i+'" onclick="chooseFlower('+i+')">✿</button>').join('')+'</div><button class="btn" onclick="checkObjective()">確認花朵數量</button>'+feedback();if(a.kind==='sun')return '<div class="roller"><button onclick="changeNum(-1)">−</button><span id="num" class="num">0</span><button onclick="changeNum(1)">＋</button></div><button class="btn" onclick="checkObjective()">鎖定這道光</button>'+feedback();if(a.kind==='animal')return '<p id="pawNote" class="paw-note">已點亮 0 / 9 個腳印</p><div class="paws">'+Array.from({length:12},(_,i)=>'<button class="paw" onclick="togglePaw('+i+')">♣</button>').join('')+'</div><button class="btn" onclick="checkObjective()">確認動物種類</button>'+feedback();if(a.kind==='feel')return '<div class="range-labels"><span>安靜、留白</span><span>溫度、共感</span></div><input id="feel" class="range" type="range" min="0" max="100" value="50"><button class="btn" onclick="advance(Number(feel.value)>62?\'emotion\':Number(feel.value)<38?\'space\':\'detail\')">鎖定感受</button>';return a.choices.map((x,i)=>'<button class="choice" onclick="advance(\''+x[1]+'\')"><b>0'+(i+1)+'</b>'+x[0]+'</button>').join('')}
function chooseFlower(x){selected=x;document.querySelectorAll('.petal').forEach((e,i)=>e.classList.toggle('active',i<x))}
function changeNum(x){selected=Math.max(0,Math.min(12,selected+x));document.getElementById('num').textContent=selected}
function togglePaw(i){let e=document.querySelectorAll('.paw')[i];e.classList.toggle('active');selected=document.querySelectorAll('.paw.active').length;document.getElementById('pawNote').textContent='已點亮 '+selected+' / 9 個腳印'}
function checkObjective(){let a=Q[n],f=document.getElementById('feedback');if(selected===a.answer){f.className='feedback good';f.textContent='找到線索了。';setTimeout(()=>advance(),550)}else{f.className='feedback bad';f.textContent=a.hint}}
function advance(k){if(k)score[k]++;n++;if(n<Q.length){screens.game.classList.add('fade');setTimeout(()=>{screens.game.classList.remove('fade');draw()},220)}else end()}
function end(){let key=Object.keys(score).sort((a,b)=>score[b]-score[a])[0];currentResult=R[key];document.getElementById('resultTitle').textContent=currentResult[0];document.getElementById('resultEn').textContent=currentResult[1];document.getElementById('resultCopy').textContent=currentResult[2];screens.game.classList.remove('active');screens.result.classList.add('active')}
function lines(ctx,text,max){let out=[],line='';for(const c of text){line+=c;if(ctx.measureText(line).width>max){out.push(line.slice(0,-1));line=c}}if(line)out.push(line);return out}
function paint(){let c=document.getElementById('canvas'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1080,1350);x.fillStyle='#ef7200';x.fillRect(0,0,1080,38);x.strokeStyle='#111';x.lineWidth=3;x.strokeRect(78,240,924,760);x.fillStyle='#111';x.font='48px serif';x.fillText('鏡界之外，你是',110,330);x.font='88px serif';x.fillText(currentResult[0],110,455);x.font='32px serif';x.fillStyle='#ef7200';x.fillText(currentResult[1],114,510);x.fillStyle='#111';x.font='37px serif';let y=610;for(const l of lines(x,currentResult[2],780)){x.fillText(l,114,y);y+=62}x.strokeStyle='#999';x.lineWidth=2;[[112,'3 朵花'],[350,'9 顆太陽'],[588,'9 種動物']].forEach(([p,t])=>{x.strokeRect(p,770,220,54);x.fillText(t,p+32,806)});x.fillStyle='#555';x.font='24px serif';x.fillText('BEYOND THE FRAME · FCU EMBA PAA',112,1120);return c}
function saveCard(){let a=document.createElement('a');a.href=paint().toDataURL();a.download='鏡界之外-我的觀看人格.png';a.click()}
async function shareCard(){let b=await new Promise(r=>paint().toBlob(r)),f=new File([b],'鏡界之外.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({title:'鏡界之外｜我的觀看人格',text:currentResult[0],files:[f]});await navigator.share({title:'鏡界之外',text:currentResult[0],url:location.href})}catch(e){if(e.name!=='AbortError'){navigator.clipboard?.writeText(location.href);alert('已複製連結。')}}}
</script></body></html>
