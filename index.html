<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鏡界之外｜互動體驗</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap');:root{--o:#ef7200;--ink:#111;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#eee;font-family:'Noto Serif TC',serif;color:var(--ink)}.app{max-width:520px;min-height:100svh;margin:auto;background:#fff;overflow:hidden}.screen{display:none;min-height:100svh;padding:22px;position:relative}.active{display:flex;flex-direction:column}.brand,.orange{background:url('assets/orange-bg.png') center/cover}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.host{width:46px;height:46px;object-fit:contain}.eventLogo{width:210px;max-width:68%;height:auto;object-fit:contain}.rule{height:1px;background:#111;margin:17px 0}.home .mainVisual{width:112%;max-width:none;margin:30px -6% 4px;display:block}.home h1{font-size:30px;line-height:1.45;margin:0}.home p{font-size:15px;line-height:1.85}.btn{width:100%;border:0;background:#111;color:#fff;padding:16px;font:16px 'Noto Serif TC';letter-spacing:1px;margin-top:18px;cursor:pointer}.btn:hover{background:var(--o)}.tiny{font:11px/1.6 'Noto Serif TC';color:#6c6c6c}.game.orange{color:#fff}.game.orange .rule{background:#fff}.game.orange .stage,.game.orange .tiny{color:#fff}.game.orange .choice,.game.orange .btn{background:#fff;color:#111;border-color:#fff}.game.orange .choice b{color:var(--o)}.counter{font:12px 'Playfair Display';letter-spacing:2px}.progress{display:flex;gap:5px;margin:17px 0 27px}.progress i{display:block;flex:1;height:4px;background:#ddd}.progress i.on{background:var(--o)}.orange .progress i{background:#ffc884}.orange .progress i.on{background:#fff}.stage{font:11px 'Playfair Display';letter-spacing:2.2px;color:var(--o)}h2{font-size:28px;line-height:1.45;margin:10px 0}.desc{font-size:14px;line-height:1.8;margin:0;color:#665e55}.orange .desc{color:#fff}.task{margin-top:auto}.choice{width:100%;display:flex;gap:12px;text-align:left;background:#fff;border:1px solid #aaa;padding:14px;margin:8px 0;font:16px 'Noto Serif TC';cursor:pointer}.choice b{font:12px 'Playfair Display';color:var(--o)}.crop{height:190px;margin:15px 0;border:2px solid currentColor;position:relative;overflow:hidden}.crop img{width:100%;height:100%;object-fit:cover;object-position:55% 40%}.crop:after{content:'SCAN TO FIND THE ORIGINAL';position:absolute;bottom:8px;right:8px;font:10px 'Playfair Display';letter-spacing:1px;color:#fff}.beam{position:absolute;left:0;right:0;height:20%;background:linear-gradient(transparent,#fff8,transparent);animation:scan 2s linear infinite}@keyframes scan{from{top:-25%}to{top:110%}}.works{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.work{background:#fff;border:1px solid #aaa;padding:0;color:#111}.work img{width:100%;aspect-ratio:1;object-fit:cover}.work span{display:block;padding:7px;font:11px 'Playfair Display'}.roller{display:flex;align-items:center;justify-content:center;gap:25px;margin:22px 0}.roller button{height:56px;width:56px;border:1px solid #aaa;background:#fff;font-size:28px}.num{font:76px/.8 'Playfair Display';min-width:90px;text-align:center}.range{width:100%;accent-color:var(--o);margin:25px 0}.result{text-align:center;background:#fff!important;padding-bottom:22px;overflow:hidden}.result:before{content:'';position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,#222 0 18%,#4a4a4a 19% 20%,#ddd 21% 32%,transparent 33%);right:-145px;top:190px;opacity:.13}.result>*{position:relative}.result .eventLogo{display:block;width:220px;max-width:76%;margin:12px auto 4px}.result-card{margin:14px 0 18px;padding:22px 20px 18px;border:1px solid #111;position:relative;text-align:left;background:linear-gradient(125deg,#fff 0 66%,#f7f2ed 66%)}.result-card:after{content:'';position:absolute;right:0;top:0;width:54%;height:5px;background:var(--o)}.result-kicker{font:11px 'Playfair Display';letter-spacing:2.4px;color:var(--o);margin:0}.result h2{font-size:35px;line-height:1.25;margin:9px 0 4px}.en{font:13px 'Playfair Display';letter-spacing:3.4px;margin:0 0 16px}.result-copy{font-size:15px;line-height:1.9;margin:0}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:19px}.badges span{border:1px solid #aaa;padding:5px 7px;font:11px 'Noto Serif TC';background:#fff}.result-footer{font:10px 'Playfair Display';letter-spacing:2px;color:#666;margin:0}.result .host{width:52px;height:52px;margin:5px auto 0}.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.share button{padding:14px;border:1px solid #111;background:#fff;font:14px 'Noto Serif TC'}.share button:last-child{background:#111;color:#fff}.fade{animation:fade .35s ease}@keyframes fade{50%{opacity:.25;transform:scale(.99)}} 
</style></head><body><main class="app">
<section id="home" class="screen home active"><div class="top"><img class="host" src="assets/host-logo.png"><span class="tiny">INTERACTIVE EXHIBITION</span></div><div class="rule"></div><img class="eventLogo" src="assets/event-logo.png"><img class="mainVisual" src="assets/main-visual.png"><h1>從一個視線開始，<br>走進鏡界之外。</h1><p>完成 6 個觀察任務，找線索、數畫面、回到原作，最後解鎖你的觀看人格。</p><button class="btn" onclick="start()">進入鏡界　ENTER</button></section>
<section id="game" class="screen game"><div class="top"><img class="host" src="assets/host-logo.png"><span id="count" class="counter"></span></div><div class="rule"></div><div class="progress" id="progress"></div><div class="stage" id="stage"></div><h2 id="question"></h2><p id="desc" class="desc"></p><div id="task" class="task"></div></section>
<section id="result" class="screen result"><div class="top"><img class="host" src="assets/host-logo.png"><span class="counter">YOUR VIEW</span></div><div class="rule"></div><img class="eventLogo" src="assets/event-logo.png"><div class="result-card"><p class="result-kicker">鏡界之外，你是</p><h2 id="rt"></h2><p id="re" class="en"></p><p id="rd" class="result-copy"></p><div class="badges"><span>3 朵花</span><span>9 顆太陽</span><span>9 種動物</span></div></div><p class="result-footer">BEYOND THE FRAME · FCU EMBA PAA</p><div class="share"><button onclick="save()">儲存結果卡</button><button onclick="share()">分享我的結果</button></div><img class="host" src="assets/host-logo.png"></section>
</main><canvas id="canvas" width="1080" height="1350" hidden></canvas><script>
const q=[['01 / CALIBRATE','先別急著看完整畫面。你的視線，先被什麼吸住？','請在展場找到最先讓你停下的一件作品。','c',[['畫面裡的光線','light'],['人物或情緒','emotion'],['被略過的小細節','detail'],['空間與留白','space']]],['02 / TRACE','鏡頭掃過局部，請回到展場找到它的原作。','正式版會換成作品局部圖與三張完整原作；此處示範互動方式。','f',[['A','detail'],['B','light'],['C','space']]],['03 / COUNT','你在這一區看見幾個「人像」線索？','用數字拉霸選擇你的答案。','r',[]],['04 / FOLLOW','找到作品後，你的視線會往哪裡走？','選擇最接近剛才觀展路徑的一種。','c',[['追著光走','light'],['停在人的表情','emotion'],['確認微小細節','detail'],['想像鏡頭外','space']]],['05 / FEEL','把此刻感受調到最接近你的刻度。','沒有對錯，只是你與畫面之間的距離。','s',[]],['06 / TAKE AWAY','離開鏡界前，你想帶走哪一種片段？','這個選擇將形成你的結果。','c',[['一束改變畫面的光','light'],['一個未說完的表情','emotion'],['一處耐人尋味的細節','detail'],['一段框外的想像','space']]]];const R={light:['逐光的人','LIGHT CHASER','你總是先看見光落下的位置。對你來說，光不只是照亮畫面，而是在替一段故事指路。'],emotion:['畫外的聆聽者','STORY LISTENER','你會停在表情、距離與關係之間。你看見的不只是一張照片，而是畫面外仍在延續的故事。'],detail:['細節採集者','DETAIL KEEPER','別人匆匆略過的紋理、線條與微小瞬間，總會被你收進眼裡。你的觀看，很安靜卻很深。'],space:['越框旅人','BEYOND THE FRAME','你會被門、倒影、留白與遠方吸引。你知道影像的邊界，從來不是故事的終點。']};let n=0,v=3,S={light:0,emotion:0,detail:0,space:0};
function start(){home.classList.remove('active');game.classList.add('active');draw()}function draw(){let a=q[n];game.classList.toggle('orange',n%2==1);count.textContent=('0'+(n+1)).slice(-2)+' / 06';stage.textContent=a[0];question.textContent=a[1];desc.textContent=a[2];progress.innerHTML=q.map((_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('');task.innerHTML=a[3]=='c'?opts(a[4]):a[3]=='f'?find(a[4]):a[3]=='r'?roll():slide()}function opts(a){return a.map((x,i)=>'<button class="choice" onclick="pick(\''+x[1]+'\')"><b>0'+(i+1)+'</b>'+x[0]+'</button>').join('')}function find(a){return '<div class="crop"><img src="assets/main-visual.png"><i class="beam"></i></div><div class="works">'+a.map((x,i)=>'<button class="work" onclick="pick(\''+x[1]+'\')"><img src="assets/main-visual.png" style="object-position:'+(i==0?'35% 40%':i==1?'70% 48%':'55% 75%')+'"><span>作品 '+x[0]+'</span></button>').join('')+'</div>'}function roll(){return '<div class="roller"><button onclick="chg(-1)">−</button><span id="num" class="num">'+v+'</span><button onclick="chg(1)">＋</button></div><button class="btn" onclick="pick(\'detail\')">確認數字</button>'}function chg(x){v=Math.max(0,Math.min(9,v+x));num.textContent=v}function slide(){return '<span>安靜、留白</span><input id="feel" class="range" type="range" min="0" max="100" value="50"><span style="float:right">溫度、共感</span><button class="btn" onclick="pick(Number(feel.value)>50?\'emotion\':\'space\')">鎖定感受</button>'}function pick(k){S[k]++;n++;if(n<6){game.classList.add('fade');setTimeout(()=>{game.classList.remove('fade');draw()},220)}else end()}function end(){let k=Object.keys(S).sort((a,b)=>S[b]-S[a])[0];window.r=R[k];rt.textContent=r[0];re.textContent=r[1];rd.textContent=r[2];game.classList.remove('active');result.classList.add('active')}function wrap(t,max){let a=[],s='';for(const c of t){s+=c;if(s.length>=max){a.push(s);s=''}}if(s)a.push(s);return a}function paint(){let x=canvas.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1080,1350);x.fillStyle='#ef7200';x.fillRect(0,0,1080,38);x.strokeStyle='#111';x.lineWidth=3;x.strokeRect(78,240,924,760);x.fillStyle='#111';x.font='48px serif';x.fillText('鏡界之外，你是',110,330);x.font='88px serif';x.fillText(r[0],110,455);x.font='32px serif';x.fillStyle='#ef7200';x.fillText(r[1],114,510);x.fillStyle='#111';x.font='37px serif';let yy=610;for(const line of wrap(r[2],18)){x.fillText(line,114,yy);yy+=62}x.strokeStyle='#999';x.lineWidth=2;x.strokeRect(112,770,220,54);x.strokeRect(350,770,220,54);x.strokeRect(588,770,220,54);x.font='25px serif';x.fillText('3 朵花',145,806);x.fillText('9 顆太陽',378,806);x.fillText('9 種動物',620,806);x.fillStyle='#555';x.font='24px serif';x.fillText('BEYOND THE FRAME · FCU EMBA PAA',112,1120);return canvas}function save(){let a=document.createElement('a');a.href=paint().toDataURL();a.download='鏡界之外-我的觀看人格.png';a.click()}async function share(){let b=await new Promise(x=>paint().toBlob(x)),f=new File([b],'鏡界之外.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({title:'鏡界之外｜我的觀看人格',text:r[0],files:[f]});await navigator.share({title:'鏡界之外',text:r[0],url:location.href})}catch(e){if(e.name!='AbortError'){navigator.clipboard.writeText(location.href);alert('已複製連結。')}}}
</script></body></html>
